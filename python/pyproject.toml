[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "japanesecolors"
version = "0.6.0"
description = "Curated colour palettes in four collections, for matplotlib and general plotting"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Paul Goldsmith-Pinkham", email = "paulgp@gmail.com" }]
keywords = ["color", "colour", "palette", "matplotlib", "colormap", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://paulgp.com/japanesecolors/"
Source = "https://github.com/paulgp/japanesecolors"
Issues = "https://github.com/paulgp/japanesecolors/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/japanesecolors"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the generators are scripts run from the repo root, not an installed package
"../data-raw/*.py" = ["INP001"]
